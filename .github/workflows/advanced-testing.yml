name: Advanced Testing & Performance Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 0 * * 0' # run weekly on Sunday at 12:15am (UTC)

jobs:
  system-compatibility:
    name: System Compatibility Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        stylelint-version: ['16.7.0', '16.x', 'latest']
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install specific stylelint version
        run: npm install --no-save stylelint@${{ matrix.stylelint-version }}

      - name: Run system compatibility tests
        run: npm run test:compatibility
        env:
          CI: true

  cross-platform:
    name: Cross-Platform Testing
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run system compatibility tests
        run: npm run test:compatibility
        env:
          CI: true

  security-and-dependencies:
    name: Security & Dependency Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=critical
